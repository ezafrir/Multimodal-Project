# Proposed bounded CPU evaluation configuration.

project: trace_driven_vehicle_verification
mode: cpu_replay
seed: 17
execution:
  device: cpu
  train_models: false
  use_cached_predictions: true
  repetitions: 3
  process_rss_budget_mb: 1024
  elapsed_budget_seconds: 120
data:
  source: synthetic_heldout
  path: data/fixtures/heldout.jsonl
  max_cases: 500
  split_method: scenario_family
  evaluator_only_ground_truth: true
claims:
  allowed_types: [object_existence, object_distance]
  frame: ego
verification:
  timestamp_tolerance_ms: 100
  distance_tolerance_m: 2.0
  min_lidar_returns: 3
  require_valid_coverage: true
  require_valid_association: true
  on_missing_evidence: uncertain
action_gate:
  fail_closed: true
  permitted_action: simulate_generic_proximity_alert
  high_risk_policy: handoff
trace:
  enabled: true
  evidence_dependencies: true
  receipt_format: jsonl
  output: artifacts/cpu/receipts.jsonl
metrics:
  - incorrect_claim_authorization_rate
  - correct_claim_acceptance
  - detection_recall
  - false_rejection_rate
  - abstention_rate
  - diagnosis_top1_accuracy
  - diagnosis_macro_f1
  - replay_resolution_rate
  - median_latency_ms
  - p95_latency_ms
  - process_rss_mb
  - receipt_bytes
fault_injection:
  enabled: true
  deterministic: true
  hide_labels_from_diagnosis: true
